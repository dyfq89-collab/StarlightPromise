name: Build Windows EXE

on:
  push:
    branches: [codex/foundation]
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build standalone executable
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name StarlightPromise --paths src --add-data "src/data;data" src/main.py
      - name: Upload Windows product
        uses: actions/upload-artifact@v4
        with:
          name: StarlightPromise-Windows
          path: dist/StarlightPromise.exe
          if-no-files-found: error
