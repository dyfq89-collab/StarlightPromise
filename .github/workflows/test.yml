name: Test game core

on:
  push:
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run core tests
        run: python -m unittest discover -s tests

  windows-desktop-smoke:
    name: Windows desktop startup smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install desktop dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify the desktop entry point imports
        run: |
          python -m py_compile src/main.py
          python -c "import sys; sys.path.insert(0, 'src'); import main; print('Desktop entry point imported successfully')"
